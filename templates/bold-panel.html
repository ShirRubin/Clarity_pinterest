<!doctype html>
<!-- Bold panel — modern variant: deeper gradient bg, white rounded card holding
     the checklist, pill "BUCKET LIST" chip. Same brand fonts as classic. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Patrick Hand SC"; src: url("fonts/PatrickHandSC-400.woff2") format("woff2"); font-weight: 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1500px; }
  .page {
    width: 1000px; height: 1500px; overflow: hidden; position: relative;
    background: linear-gradient(150deg, {{ACCENT_SOFT}} 0%, {{BG}} 45%, {{BG2}} 100%);
    display: flex; flex-direction: column; padding: 56px 56px 36px;
  }
  .emoji-row {
    position: absolute; top: 48px; right: 60px; font-size: 64px; letter-spacing: 8px;
    font-family: "Segoe UI Emoji", sans-serif; opacity: 0.9;
  }
  header { text-align: left; padding: 8px 14px 26px; position: relative; z-index: 1; }
  .title-main {
    font-family: "Fredoka"; font-weight: 700; text-transform: uppercase;
    color: {{ACCENT_DARK}}; font-size: {{TITLE_SIZE}}px; line-height: 1.04;
    max-width: 780px;
  }
  .chip {
    display: inline-block; margin-top: 18px; background: {{ACCENT}}; color: #fff;
    font-family: "Fredoka"; font-weight: 600; text-transform: uppercase;
    font-size: 30px; letter-spacing: 8px; padding: 12px 34px; border-radius: 999px;
  }
  .panel {
    flex: 1; background: rgba(255,255,255,0.92); border-radius: 44px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.10);
    padding: 46px 52px; display: flex; flex-direction: column; position: relative; z-index: 1;
  }
  .checklist {
    list-style: none; flex: 1; display: flex; flex-direction: column;
    justify-content: space-evenly;
  }
  .checklist li { display: flex; align-items: center; gap: 26px; }
  .box {
    flex: 0 0 40px; width: 40px; height: 40px; border: 4px solid {{CHECK}};
    border-radius: 12px; background: {{BG2}};
  }
  .item-text {
    font-family: "Patrick Hand SC"; font-size: 37px; line-height: 1.08;
    color: {{TEXT}}; text-transform: uppercase; padding-top: 2px;
  }
  .open-slot { justify-content: center; text-align: center; }
  .open-slot .item-text {
    color: {{ACCENT}}; font-family: "Fredoka"; font-weight: 600; font-size: 31px;
  }
  footer {
    text-align: center; padding-top: 24px; position: relative; z-index: 1;
    font-family: "Fredoka"; font-weight: 600; font-size: 32px; color: {{ACCENT_DARK}};
  }
</style>
</head>
<body>
  <div class="page">
    <div class="emoji-row">{{EMOJI}}</div>
    <header>
      <div class="title-main">{{TITLE_MAIN}}</div>
      <div class="chip">Bucket List</div>
    </header>
    <div class="panel">
      <ul class="checklist">
        {{ITEMS}}
      </ul>
    </div>
    <footer>@claritybucketlists</footer>
  </div>
</body>
</html>
