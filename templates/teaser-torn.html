<!doctype html>
<!-- Teaser, "torn peek" (option A, chosen 2026-09-27): the sticky-note paper torn
     off below the first three items, the fourth cut mid-line. Under the tear, on
     the gradient: how many more there are, then the pill "tap the pin" and the
     address. The image never carries the whole list, so the click has a reason.
     Same fonts, palette tokens and watermark as the four full-list templates. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Patrick Hand SC"; src: url("fonts/PatrickHandSC-400.woff2") format("woff2"); font-weight: 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1500px; }
  .page {
    width: 1000px; height: 1500px; overflow: hidden; position: relative;
    background: linear-gradient(160deg, {{BG}} 0%, {{BG2}} 100%);
    display: flex; flex-direction: column; align-items: center; padding: 100px 60px 36px;
  }
  .paper {
    position: relative; width: 880px; background: #fffdf8; border-radius: 18px 18px 0 0;
    transform: rotate(-1.6deg);
    box-shadow: 0 30px 70px rgba(0,0,0,0.14);
    padding: 96px 60px 26px; display: flex; flex-direction: column;
  }
  .tape {
    position: absolute; top: -26px; left: 50%; width: 300px; height: 60px;
    transform: translateX(-50%) rotate(2.5deg); border-radius: 4px; opacity: 0.92;
    background: repeating-linear-gradient(45deg, {{ACCENT_SOFT}} 0 14px, rgba(255,255,255,0.55) 14px 28px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .sticker {
    position: absolute; top: -44px; right: -34px; font-size: 120px; line-height: 1;
    transform: rotate(12deg); font-family: "Segoe UI Emoji", sans-serif;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.18));
  }
  header { text-align: center; margin-bottom: 34px; }
  .title-main {
    font-family: "Fredoka"; font-weight: 700; text-transform: uppercase;
    color: {{ACCENT}}; font-size: {{TITLE_SIZE}}px; line-height: 1.04;
  }
  .title-sub {
    font-family: "Patrick Hand SC"; color: {{ACCENT_SOFT}}; font-size: 44px;
    letter-spacing: 12px; text-transform: uppercase; margin-top: 8px;
  }
  .checklist { list-style: none; display: flex; flex-direction: column; gap: 36px; }
  .checklist li { display: flex; align-items: center; gap: 26px; }
  .box {
    flex: 0 0 42px; width: 42px; height: 42px; border: 3.5px solid {{CHECK}};
    border-radius: 14px 9px 16px 8px; background: #fff; transform: rotate(-3deg);
  }
  .checklist li:nth-child(even) .box { transform: rotate(4deg); border-radius: 8px 15px 9px 14px; }
  .item-text {
    font-family: "Patrick Hand SC"; font-size: 38px; line-height: 1.08;
    color: {{TEXT}}; text-transform: uppercase; padding-top: 2px;
  }
  /* the fourth item, cut by the tear */
  .cut { overflow: hidden; height: 30px; opacity: 0.55; margin-top: 4px; }
  .tear {
    position: absolute; left: 0; right: 0; bottom: -22px; height: 44px; background: #fffdf8;
    clip-path: polygon(0 0, 4% 60%, 9% 20%, 14% 70%, 20% 30%, 26% 80%, 31% 35%, 37% 75%, 43% 25%, 49% 65%, 55% 30%, 61% 85%, 67% 40%, 73% 70%, 79% 20%, 85% 75%, 91% 35%, 96% 65%, 100% 25%, 100% 0);
  }
  .below {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; text-align: center; padding-top: 40px;
  }
  .more {
    font-family: "Fredoka"; font-weight: 700; font-size: 72px; color: {{ACCENT_DARK}}; line-height: 1;
  }
  .more small {
    display: block; font-family: "Patrick Hand SC"; font-weight: 400; font-size: 42px;
    color: {{ACCENT}}; letter-spacing: 3px; text-transform: uppercase; margin-top: 10px;
  }
  .cta { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cta-pill {
    background: {{ACCENT}}; color: #fff; font-family: "Fredoka"; font-weight: 600;
    font-size: 34px; padding: 18px 44px; border-radius: 999px; white-space: nowrap;
  }
  .cta-url {
    font-family: "Fredoka"; font-weight: 700; font-size: 40px; color: {{ACCENT_DARK}};
    letter-spacing: 1px;
  }
  footer {
    text-align: center; padding-top: 22px;
    font-family: "Fredoka"; font-weight: 600; font-size: 34px; color: {{ACCENT}};
  }
</style>
</head>
<body>
  <div class="page">
    <div class="paper">
      <div class="tape"></div>
      <div class="sticker">{{EMOJI}}</div>
      <header>
        <div class="title-main">{{TITLE_MAIN}}</div>
        <div class="title-sub">Bucket List</div>
      </header>
      <ul class="checklist">
        {{TEASER_ITEMS}}
        <li class="cut"><span class="box"></span><span class="item-text">{{TEASER_CUT}}</span></li>
      </ul>
      <div class="tear"></div>
    </div>
    <div class="below">
      <div class="more">+{{REST_COUNT}} more<small>and a free printable</small></div>
      <div class="cta">
        <div class="cta-pill">tap the pin for the full list</div>
        <div class="cta-url">clarity-lists.com</div>
      </div>
    </div>
    <footer>@claritybucketlists</footer>
  </div>
</body>
</html>
