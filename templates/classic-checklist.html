<!doctype html>
<!-- Classic Clarity checklist — the signature look of the live account:
     pastel bg, chunky rounded title, hand-print caps items, rounded checkboxes,
     big faded emoji as the themed decoration, @claritybucketlists watermark. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Patrick Hand SC"; src: url("fonts/PatrickHandSC-400.woff2") format("woff2"); font-weight: 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1500px; }
  .page {
    width: 1000px; height: 1500px; overflow: hidden; position: relative;
    background: linear-gradient(160deg, {{BG}} 0%, {{BG2}} 100%);
    display: flex; flex-direction: column; padding: 64px 64px 40px;
  }
  .deco {
    position: absolute; right: -60px; bottom: 60px; font-size: 400px;
    opacity: 0.14; transform: rotate(-8deg); line-height: 1;
    font-family: "Segoe UI Emoji", sans-serif; pointer-events: none;
  }
  header { text-align: center; margin-bottom: 30px; position: relative; z-index: 1; }
  .title-main {
    font-family: "Fredoka"; font-weight: 700; text-transform: uppercase;
    color: {{ACCENT}}; font-size: {{TITLE_SIZE}}px; line-height: 1.04; letter-spacing: 1px;
  }
  .title-sub {
    font-family: "Fredoka"; font-weight: 600; text-transform: uppercase;
    color: {{ACCENT_SOFT}}; font-size: 44px; letter-spacing: 14px; margin-top: 10px;
  }
  .checklist {
    list-style: none; flex: 1; display: flex; flex-direction: column;
    justify-content: space-evenly; position: relative; z-index: 1;
  }
  .checklist li { display: flex; align-items: center; gap: 30px; }
  .box {
    flex: 0 0 46px; width: 46px; height: 46px; border: 4px solid {{CHECK}};
    border-radius: 14px; background: rgba(255,255,255,0.55);
  }
  .item-text {
    font-family: "Patrick Hand SC"; font-size: 40px; line-height: 1.08;
    color: {{TEXT}}; text-transform: uppercase; padding-top: 2px;
  }
  .open-slot {
    justify-content: center; text-align: center;
  }
  .open-slot .item-text {
    color: {{ACCENT}}; font-family: "Fredoka"; font-weight: 600; font-size: 34px;
    letter-spacing: 1px;
  }
  footer {
    text-align: center; padding-top: 26px; position: relative; z-index: 1;
    font-family: "Fredoka"; font-weight: 600; font-size: 34px; color: {{ACCENT}};
  }
</style>
</head>
<body>
  <div class="page">
    <div class="deco">{{EMOJI}}</div>
    <header>
      <div class="title-main">{{TITLE_MAIN}}</div>
      <div class="title-sub">Bucket List</div>
    </header>
    <ul class="checklist">
      {{ITEMS}}
    </ul>
    <footer>@claritybucketlists</footer>
  </div>
</body>
</html>
